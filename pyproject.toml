[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciaccel-pipeline"
version = "0.1.2"
description = "sab: the ScienceAccelBench packaging CLI (one tool, two modes), as a versioned package"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.scripts]
sab = "sciaccel_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sciaccel_pipeline = [
    "templates/*",
    "templates/check/invariants/*",
    "templates/check/pointwise/*",
    "templates/task/*",
    "templates/task/comment/*",
    "templates/task/environment/*",
    "templates/task/solution/*",
    "templates/task/target/*",
    "templates/task/tests/*",
]
